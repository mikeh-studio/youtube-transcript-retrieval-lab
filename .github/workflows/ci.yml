name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run both Python regression suites with isolated fixtures
        env:
          HF_HUB_OFFLINE: "1"
          YT_RAG_FORCE_HASH_EMBEDDINGS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests/ multilingual/tests/ -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
          python scripts/check_distribution.py dist/*
      - name: Install wheel in a separate environment and exercise the real app
        run: |
          python -m venv "$RUNNER_TEMP/retrieval-install"
          "$RUNNER_TEMP/retrieval-install/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/retrieval-install/bin/python" scripts/smoke_installed.py --output-dir "$RUNNER_TEMP/retrieval-smoke"
      - name: Rebuild from the source archive and repeat installed checks
        run: |
          "$RUNNER_TEMP/retrieval-install/bin/python" -m pip wheel --no-deps dist/*.tar.gz --wheel-dir "$RUNNER_TEMP/rebuilt"
          python scripts/check_distribution.py "$RUNNER_TEMP"/rebuilt/*.whl
          "$RUNNER_TEMP/retrieval-install/bin/python" -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/rebuilt/*.whl
          "$RUNNER_TEMP/retrieval-install/bin/python" scripts/smoke_installed.py --output-dir "$RUNNER_TEMP/retrieval-smoke-source"

  frontend-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build local preview bundle
        run: npm run build:web

      - name: Verify checked-in bundle is current
        run: git diff --exit-code -- local_preview/web/assets

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run answer-mode regression
        run: npx playwright test e2e/qa-answer-mode.spec.ts
