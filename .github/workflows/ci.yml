name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools -c requirements-security.txt
          pip install -r requirements.txt pytest pip-audit

      - name: Audit installed Python dependencies
        run: pip-audit --progress-spinner off

      - name: Run repository test suite
        run: pytest tests/ -q

      - name: Run chunking regression suite
        run: HF_HUB_OFFLINE=1 pytest multilingual/tests/test_chunking_strategies.py -q

  frontend-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Build local preview bundle
        run: npm run build:web

      - name: Verify checked-in bundle is current
        run: git diff --exit-code -- local_preview/web/assets

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run workspace and evaluation regressions
        run: npx playwright test e2e/qa-answer-mode.spec.ts e2e/workbench.spec.ts e2e/library.spec.ts e2e/shell-redesign.spec.ts e2e/evaluation-dashboard.spec.ts
