<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evaluation | Retrieval Lab</title>
    <link rel="icon" href="./icons/favicon-ytrag.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./evaluation-dashboard.css" />
    <script src="/browser-session.js"></script>
  </head>
  <body class="evaluation-dashboard">
    <header class="appbar">
      <a class="brand brand-link" href="./index.html"
        ><img src="./icons/icon-play.svg" alt="" /><span>Retrieval Lab</span></a
      >
      <nav class="appbar-nav" aria-label="Primary"></nav>
    </header>
    <div class="eval-layout">
      <aside class="run-sidebar">
        <div class="sidebar-title">Runs</div>
        <a class="query-link" href="./evaluation-workbench.html">+ Query sets</a
        ><label class="sr-only" for="runSearch">Search runs</label
        ><input id="runSearch" type="search" placeholder="Search runs…" />
        <div id="runList"></div>
      </aside>
      <main class="eval-main">
        <div class="page-heading">
          <div>
            <h1 id="runTitle">Evaluation</h1>
            <p id="runSubtitle">Saved reports and review history</p>
          </div>
          <label class="import-button"
            >Import report<input
              id="importReport"
              type="file"
              accept="application/json,.json"
          /></label>
        </div>
        <p id="notice" role="status" aria-live="polite"></p>
        <div id="dashboard"></div>
      </main>
    </div>
    <script type="module" src="./evaluation-dashboard.js"></script>
  </body>
</html>
